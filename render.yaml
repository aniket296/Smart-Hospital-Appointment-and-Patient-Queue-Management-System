# =============================================================================
# Render Blueprint: Project 25 - Smart Hospital Appointment & Queue System
# Provisions:
#   1. Render PostgreSQL Database (smart-hospital-db / hospital_queue_db)
#   2. Flask Backend Web Service (smart-hospital-api)
#   3. React Static Site (smart-hospital-web) with SPA routing rewrite
# =============================================================================

databases:
  - name: smart-hospital-db
    databaseName: hospital_queue_db
    user: hospital_queue_user
    plan: free

services:
  # 1. Flask Backend Web Service
  - type: web
    name: smart-hospital-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: HOSPITAL_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_EXPIRY_HOURS
        value: "8"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-hospital-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_FROM
        value: noreply@hospital.test

  # 2. React Frontend Static Site
  - type: web
    name: smart-hospital-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-hospital-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
